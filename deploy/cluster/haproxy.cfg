global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    retries 0

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold nx 3s

frontend tinysql
    bind :8080
    acl force_primary req.hdr(X-tinySQL-Consistency) -i primary
    acl read_route path -i /api/query /api/query/stream
    use_backend primary if force_primary
    use_backend reads if read_route
    default_backend primary

backend primary
    option httpchk GET /readyz/write
    http-check expect status 200
    http-response set-header X-tinySQL-Backend %[srv_name]
    server primary primary:8080 check inter 1s fall 2 rise 1 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

backend reads
    balance roundrobin
    option httpchk GET /readyz/read
    http-check expect status 200
    http-response set-header X-tinySQL-Backend %[srv_name]
    server replica1 replica1:8080 check inter 1s fall 2 rise 1 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
    server replica2 replica2:8080 check inter 1s fall 2 rise 1 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
    server primary primary:8080 check backup inter 1s fall 2 rise 1 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
