name: Swift / Apple integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**/*.go', 'go.mod', 'go.sum', 'Makefile', 'bindings/apple/**', 'bindings/c/**', 'bindings/swift/**', '.github/workflows/apple.yml']
  pull_request:
    paths: ['**/*.go', 'go.mod', 'go.sum', 'Makefile', 'bindings/apple/**', 'bindings/c/**', 'bindings/swift/**', '.github/workflows/apple.yml']

permissions:
  contents: read

concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test native bridge with race detector
        run: go test -race ./bindings/c
      - name: Build and package macOS, iOS and simulator XCFramework
        run: make package-apple-release URL=https://example.invalid/CTinySQL.xcframework.zip
      - name: Run Swift integration tests
        run: swift test --package-path bindings/swift
      - name: Check Swift 6 compatibility
        run: swift build --package-path bindings/swift -Xswiftc -swift-version -Xswiftc 6
      - name: Build the package with the iOS SDK
        working-directory: bindings/swift
        run: xcodebuild -quiet -scheme TinySQL -destination 'generic/platform=iOS' -derivedDataPath .build/xcode-ios CODE_SIGNING_ALLOWED=NO build
      - name: Run Swift tests on the iOS Simulator
        working-directory: bindings/swift
        run: |
          device="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, entries in devices.items():
              if "iOS" not in runtime:
                  continue
              for device in entries:
                  if device.get("isAvailable") and "iPhone" in device["name"]:
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("No available iPhone simulator; install an iOS runtime in Xcode.")
          ')"
          xcodebuild -quiet test -scheme TinySQL -destination "id=$device" -derivedDataPath .build/xcode-sim CODE_SIGNING_ALLOWED=NO
