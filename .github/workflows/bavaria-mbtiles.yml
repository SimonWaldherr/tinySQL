name: Bavaria MBTiles Demo (Dingolfing-Landau)

# Builds a real, OpenStreetMap-derived vector tileset for the Landkreis
# Dingolfing-Landau and publishes it to a rolling GitHub Release and the
# gh-pages branch. The browser loads the gh-pages copy from its own origin:
# GitHub Release downloads redirect to a storage host without browser CORS
# access. The multi-megabyte snapshot stays out of the main repository history.
#
# This job downloads Geofabrik's Niederbayern extract, clips and tiles it
# (see scripts/build-bavaria-tiles.sh for the osmium/tippecanoe details and
# why they run outside Go), then imports the result through tinySQL's own
# ImportMBTiles (cmd/mbtilesregion) to produce the browser snapshot.
#
# Manual and monthly rather than on every push: it downloads a multi-hundred-
# MB regional extract and runs a multi-minute native toolchain, which has no
# business gating ordinary PRs.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 3 1 * *' # 03:17 UTC on the 1st of each month

permissions:
  contents: write # to publish the release asset

env:
  RELEASE_TAG: bavaria-demo-latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ${{ github.workspace }}/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # osmium-tool: apt (Ubuntu's universe repo carries a recent enough
      # build). tippecanoe: no Ubuntu package, so build the small, fast-to-
      # compile release tag from source -- this is the standard install path
      # documented in the tippecanoe README for CI environments.
      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Install tippecanoe
        run: |
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch 2.63.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo make -C /tmp/tippecanoe install

      - name: Build the tileset (download, extract, tile)
        run: ./scripts/build-bavaria-tiles.sh build/bavaria

      - name: Import through tinySQL and build the browser snapshot
        run: |
          go run -tags=sqliteimport ./cmd/mbtilesregion \
            -in build/bavaria/dingolfing-landau.mbtiles \
            -out build/bavaria/artifacts \
            -table tiles

      - name: Publish to the rolling release
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --title "Bavaria MBTiles demo data (Dingolfing-Landau)" \
              --notes "Auto-published by .github/workflows/bavaria-mbtiles.yml. Source: Geofabrik niederbayern-latest.osm.pbf, © OpenStreetMap contributors (ODbL)." \
              --prerelease
          gh release upload "$RELEASE_TAG" \
            build/bavaria/artifacts/snapshot.b64 \
            build/bavaria/dingolfing-landau.mbtiles \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish same-origin snapshot to gh-pages
        run: |
          set -euo pipefail
          pages_dir="$(mktemp -d)"
          trap 'rm -rf "$pages_dir"' EXIT
          git fetch origin gh-pages:gh-pages
          git worktree add "$pages_dir" gh-pages
          cp build/bavaria/artifacts/snapshot.b64 "$pages_dir/bavaria-snapshot.b64"
          git -C "$pages_dir" add bavaria-snapshot.b64
          if git -C "$pages_dir" diff --cached --quiet; then
            echo "gh-pages Bavaria snapshot is already current"
            exit 0
          fi
          git -C "$pages_dir" config user.name "github-actions[bot]"
          git -C "$pages_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$pages_dir" commit -m "Update Bavaria demo snapshot"
          git -C "$pages_dir" push origin gh-pages
