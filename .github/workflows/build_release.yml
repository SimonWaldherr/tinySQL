name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.goos }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            ext: so
            arch: amd64
          - runner: ubuntu-latest
            goos: linux
            ext: so
            arch: arm64
          - runner: macos-latest
            goos: darwin
            ext: dylib
            arch: amd64
          - runner: macos-latest
            goos: darwin
            ext: dylib
            arch: arm64
          - runner: ubuntu-latest
            goos: windows
            ext: dll
            arch: amd64
          - runner: ubuntu-latest
            goos: windows
            ext: dll
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Build CLI and shared lib
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Building for ${MATRIX_GOOS:-${{ matrix.goos }}}/${MATRIX_ARCH:-${{ matrix.arch }}} on runner $RUNNER_OS"
          GOOS=${{ matrix.goos }}
          GOARCH=${{ matrix.arch }}
          EXT=${{ matrix.ext }}
          ART=artifacts
          PKGDIR=$ART/pkg
          mkdir -p "$PKGDIR"

          # Build CLI binary (cmd/tinysql)
          echo "Building CLI: tinysql for $GOOS-$GOARCH"
          # Disable cgo for cross-compiling the pure-Go CLI to avoid needing cross-toolchain.
          binary=$PKGDIR/tinysql-$GOOS-$GOARCH
          if [ "$GOOS" = windows ]; then binary="$binary.exe"; fi
          CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
            -trimpath -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME:-dev} -X github.com/SimonWaldherr/tinySQL/internal/engine.BuildVersion=${GITHUB_REF_NAME:-dev}" \
            -o "$binary" ./cmd/tinysql

          # Build the C ABI (bindings/c) as shared and static library
          # c-shared requires a native C toolchain; skip when target OS or
          # architecture differs from the runner. The CLI above remains fully
          # cross-compiled and is the supported artifact on every matrix row.
          runner_goos=$(go env GOHOSTOS)
          runner_arch=$(go env GOHOSTARCH)
          native_ok=false
          if [ "$runner_goos" = "$GOOS" ] && [ "$runner_arch" = "$GOARCH" ]; then native_ok=true; fi
          if [ "$native_ok" = true ]; then
            echo "Building c-shared library"
            CGO_ENABLED=1 GOOS=$GOOS GOARCH=$GOARCH go build -buildmode=c-shared \
              -ldflags "-X github.com/SimonWaldherr/tinySQL/internal/engine.BuildVersion=${GITHUB_REF_NAME:-dev}" \
              -o "$PKGDIR/libtinysql.$EXT" ./bindings/c
            CGO_ENABLED=1 GOOS=$GOOS GOARCH=$GOARCH go build -buildmode=c-archive \
              -ldflags "-X github.com/SimonWaldherr/tinySQL/internal/engine.BuildVersion=${GITHUB_REF_NAME:-dev}" \
              -o "$PKGDIR/libtinysql.a" ./bindings/c
            # Ship the documented ABI header instead of cgo's generated one.
            rm -f "$PKGDIR/libtinysql.h"
            cp bindings/c/include/tinysql.h "$PKGDIR/tinysql.h"
          else
            echo "Skipping C ABI build for $GOOS-$GOARCH on $runner_goos/$runner_arch (no cross C toolchain)"
          fi

          # Package artifacts into tar.gz
          TARFILE=$ART/tinysql-$GOOS-$GOARCH-${GITHUB_REF_NAME:-untagged}.tar.gz
          pushd "$PKGDIR" >/dev/null
          COPYFILE_DISABLE=1 tar -czf "../$(basename "$TARFILE")" .
          popd >/dev/null

          # Compute SHA256 (portable)
          FILE=$TARFILE
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$FILE" > "$FILE.sha256"; else shasum -a 256 "$FILE" > "$FILE.sha256"; fi

          ls -lah artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tinysql-${{ matrix.goos }}-${{ matrix.arch }}-${{ github.ref_name }}
          path: artifacts/*.tar.gz

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.goos }}-${{ matrix.arch }}-${{ github.ref_name }}
          path: artifacts/*.sha256

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # A workflow_dispatch run validates artifacts but never publishes one.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: tinysql-*
          merge-multiple: true
          path: dist

      - name: Generate combined checksums
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f -name '*.tar.gz' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
