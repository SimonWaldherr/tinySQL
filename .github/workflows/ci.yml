name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Refuses compiled output and oversized blobs before they reach main.
  # .gitignore stops the accident on a machine that has the repo checked out;
  # this stops it on the one path that matters regardless of anybody's local
  # git config, and it is why the ignore rules must live in the repo rather
  # than in a personal global gitignore. Two binaries have reached this
  # repository's history already (query_files.wasm, tinySQL.test).
  no-binaries:
    name: No binaries or oversized files
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Reject committed build artifacts
        run: |
          set -euo pipefail
          # Extensions that are always build output, never source.
          if bad=$(git ls-files | grep -iE '\.(exe|dll|so|dylib|a|o|wasm|test|prof|pprof|trace)$' || true); [ -n "$bad" ]; then
            echo "::error::Compiled artifacts are tracked in git:"
            echo "$bad"
            echo "Add them to .gitignore and 'git rm --cached' them."
            exit 1
          fi
          echo "No compiled artifacts tracked."

      - name: Reject oversized files
        env:
          # Largest legitimate file today is a ~720 KB generated JS demo
          # dataset, so 2 MiB leaves room without letting a binary through.
          MAX_BYTES: 2097152
        run: |
          set -euo pipefail
          oversized=$(git ls-tree -r -l HEAD \
            | awk -v max="$MAX_BYTES" '$4 != "-" && $4+0 > max {printf "%.1f MB  %s\n", $4/1048576, $5}')
          if [ -n "$oversized" ]; then
            echo "::error::Files over $((MAX_BYTES / 1048576)) MiB are tracked in git:"
            echo "$oversized"
            echo "Large fixtures belong outside the repository, or behind Git LFS."
            exit 1
          fi
          echo "No file exceeds $((MAX_BYTES / 1048576)) MiB."

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download deps
        run: go mod download

      - name: Check gofmt
        run: |
          files=$(git ls-files '*.go')
          if [ -n "$files" ]; then
            unformatted=$(gofmt -l $files)
            if [ -n "$unformatted" ]; then
              echo "Unformatted Go files:"
              echo "$unformatted"
              exit 1
            fi
          fi

      - name: Build all packages
        run: go build ./...

      - name: Build WebAssembly targets
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -o /tmp/tinysql-browser.wasm ./cmd/wasm_browser
          GOOS=js GOARCH=wasm go build -trimpath -o /tmp/tinysql-node.wasm ./cmd/wasm_node
          (
            cd cmd/query_files_wasm
            GOOS=js GOARCH=wasm go build -trimpath -o /tmp/query-files.wasm .
          )

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests (no cache)
        run: go test ./... -count=1

      - name: Run JSON v2 compatibility tests
        run: GOEXPERIMENT=jsonv2 go test ./internal/storage ./internal/engine -count=1

      - name: Run race tests
        run: go test ./... -race -count=1

      - name: Run coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Summarize coverage
        run: |
          go tool cover -func=coverage.out -o coverage.txt
          tail -1 coverage.txt >> $GITHUB_STEP_SUMMARY

  # This intentionally runs independently of the main test job: TinyGo is an
  # optional release compiler, so its smoke test must not extend the critical
  # path of Go tests. It skips wasm-opt, whose output-size work is validated
  # locally/release builds and is irrelevant to the runtime ABI check.
  tinygo-wasm:
    name: TinyGo WASM smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build and smoke-test Node WASM
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env XDG_CACHE_HOME=/tmp/.cache \
            --volume "$PWD:/src" \
            --workdir /src/cmd/wasm_node \
            tinygo/tinygo:0.41.1 \
            sh -lc 'WASM_COMPILER=tinygo WASM_OPTIMIZE=false ./build.sh --build-only'
          node cmd/wasm_node/wasm_runner.js query 'SELECT 1 AS ready'

  vector-simd-amd64:
    name: Vector SIMD (linux/amd64)
    runs-on: ubuntu-latest
    env:
      GOARCH: amd64
      GOAMD64: v1
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-amd64-v1-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-amd64-v1-
            ${{ runner.os }}-go-

      - name: Download deps
        run: go mod download

      - name: Verify amd64 runner settings
        run: |
          test "$(go env GOOS)" = "linux"
          test "$(go env GOARCH)" = "amd64"
          test "$(go env GOAMD64)" = "v1"
          uname -m

      - name: Run engine tests with amd64 SIMD
        run: go test ./internal/engine -count=1 -v

      - name: Run vector SIMD benchmarks
        run: |
          set -o pipefail
          go test ./internal/engine \
            -run '^$' \
            -bench 'BenchmarkVector(Dot768|DotUnrolled768|L2Squared768|L2SquaredUnrolled768|L1Distance768|L1DistanceUnrolled768)|BenchmarkVecSearchIndexModesSameTable' \
            -benchmem \
            -benchtime=500ms \
            -count=3 | tee vector-amd64-bench.txt
          {
            echo "### Vector SIMD amd64 benchmark"
            echo
            echo '```'
            cat vector-amd64-bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload vector benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: vector-amd64-bench
          path: vector-amd64-bench.txt

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build-bindings:
    name: Build Bindings
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Python Bindings
        run: |
          cd bindings/python
          make build

      - name: Build ODBC Bindings
        run: |
          cd odbc
          make linux
