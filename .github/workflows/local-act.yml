name: Local CI (act)

# Run locally with: act workflow_dispatch -W .github/workflows/local-act.yml
# Pushes and pull requests are covered by ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Run standard-Go CI matrix
        run: make ci

      - name: Summarize coverage
        run: |
          go tool cover -func=bin/coverage.out
