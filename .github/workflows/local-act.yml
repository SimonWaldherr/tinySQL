name: Local CI (act)

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run standard-Go CI matrix
        run: make ci

      - name: Summarize coverage
        run: |
          go tool cover -func=coverage.out
