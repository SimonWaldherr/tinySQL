{{define "query"}}
{{template "base_start" (dict "Tables" .Tables "ActiveTable" "")}}

<div class="page-hdr">
  <h1><i class="bi bi-terminal text-primary"></i>SQL Editor</h1>
</div>

{{template "alert" .}}

<div class="card">
  <div class="card-body pb-2">
    <textarea id="sqlInput" class="sql-editor" rows="6"
              placeholder="SELECT * FROM your_table LIMIT 100"
              spellcheck="false">{{.SQL}}</textarea>
    <div class="d-flex gap-2 align-items-center mt-2 mb-1">
      <button id="runBtn" class="btn btn-primary btn-sm" data-action="run-query">
        <i class="bi bi-play-fill me-1"></i>Run <kbd class="ms-1 opacity-75 kbd-hint">Ctrl+Enter</kbd>
      </button>
      <button class="btn btn-outline-secondary btn-sm" data-action="clear-editor">
        <i class="bi bi-x-lg me-1"></i>Clear
      </button>
      <button class="btn btn-outline-secondary btn-sm" data-action="export-query" data-format="csv">
        <i class="bi bi-filetype-csv me-1"></i>CSV
      </button>
      <button class="btn btn-outline-secondary btn-sm" data-action="export-query" data-format="json">
        <i class="bi bi-filetype-json me-1"></i>JSON
      </button>
      <span id="statusMsg" class="small text-muted ms-2"></span>
    </div>
  </div>
</div>

<div id="resultArea"></div>

<!-- No-JS fallback (hidden when JS is active) -->
<noscript>
  <div class="card mt-2">
    <div class="card-body">
      <form method="post" action="/query">
        <textarea name="sql" class="sql-editor" rows="6"
                  placeholder="SELECT * FROM your_table">{{.SQL}}</textarea>
        <button type="submit" class="btn btn-primary btn-sm mt-2">Run</button>
      </form>
      {{with .Result}}
      {{if .Err}}
      <div class="alert alert-danger mt-3">{{.Err}}</div>
      {{else if .Columns}}
      <div class="table-responsive mt-3">
        <table class="table table-sm result-table">
          <thead><tr>{{range .Columns}}<th>{{.}}</th>{{end}}</tr></thead>
          <tbody>
            {{range .Rows}}<tr>{{range .}}<td>{{.}}</td>{{end}}</tr>{{end}}
          </tbody>
        </table>
      </div>
      {{else}}
      <div class="alert alert-success mt-3">
        Rows affected: {{.Affected}} ({{.Elapsed}})
      </div>
      {{end}}
      {{end}}
    </div>
  </div>
</noscript>


{{template "base_end" .}}
{{end}}
