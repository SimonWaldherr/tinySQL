<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline POI Explorer</title><link rel="stylesheet" href="/static/base.css"><link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header><div><strong>Offline POI Explorer</strong><span id="status">Lade lokalen Snapshot …</span></div></header>
  <main>
    <section class="panel">
      <form id="search">
        <label>Suchbegriff (optional) <input id="query" autofocus placeholder="Ort, Kategorie oder Name"></label>
        <fieldset><legend>Optional: Umkreissuche</legend>
          <label>Längengrad <input id="lon" type="number" step="any" min="-180" max="180" placeholder="11.5756"></label>
          <label>Breitengrad <input id="lat" type="number" step="any" min="-90" max="90" placeholder="48.1372"></label>
          <label>Radius in Metern <input id="radius" type="number" step="any" min="0" placeholder="1500"></label>
        </fieldset>
        <div class="actions"><button>Suchen</button><button type="button" id="all">Alle POIs</button></div>
      </form>
    </section>
    <section class="layout"><div class="panel"><h1 id="count">Treffer</h1><div id="results"></div></div><div class="panel"><h2>Karte</h2><svg id="map" viewBox="0 0 680 420" role="img" aria-label="Rot: gefundene Orte; Ring: Suchzentrum"></svg><p class="hint">Rot: Ort · Ring: Suchzentrum. Die Daten bleiben im lokalen TinySQL-Snapshot; externe Kartenkacheln werden nicht geladen.</p></div></section>
  </main><script src="/static/app.js"></script>
</body></html>
