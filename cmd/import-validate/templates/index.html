<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import Validate</title><link rel="stylesheet" href="/static/app.css"></head><body><header><div><strong>Import Validate</strong><span>CSV prüfen, dann bewusst in TinySQL übernehmen</span></div></header><main><section class="panel"><h1>CSV validieren</h1><form id="upload"><label>Zieltabelle <input name="target" value="contacts" pattern="[A-Za-z_][A-Za-z0-9_]*" required></label><label>CSV-Datei <input name="file" type="file" accept=".csv,text/csv" required></label><label>Regeln (JSON) <textarea name="rules" rows="9">[
  {"column":"email","required":true,"type":"email","unique":true},
  {"column":"age","type":"integer","min":0,"max":130}
]</textarea></label><button>Prüfen</button></form><p class="hint">Alle Spaltennamen müssen sichere SQL-Namen sein. Felder können mit <code>target</code> umbenannt werden.</p></section><section class="panel" id="result"><h2>Prüfergebnis</h2><p>Noch kein Import geprüft.</p></section><section class="panel"><h2>Letzte Importe</h2><div class="table-wrap"><table><thead><tr><th>Zeit</th><th>Datei</th><th>Ziel</th><th>Zeilen</th><th>Status</th></tr></thead><tbody id="runs"></tbody></table></div></section></main><script src="/static/app.js"></script></body></html>
