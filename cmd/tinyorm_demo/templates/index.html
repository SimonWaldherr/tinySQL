<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Places Directory</title><link rel="stylesheet" href="/static/app.css"></head><body><header><div><strong>Places Directory</strong><span>tinyORM, persistenter TinySQL-Snapshot und Browser-UI</span></div></header><main><section class="panel filters"><label>Land <input id="country" maxlength="2" placeholder="DE"></label><label>Status <select id="active"><option value="all">Alle</option><option value="active">Aktiv</option><option value="inactive">Inaktiv</option></select></label><button id="filter">Filtern</button></section><section class="layout"><section class="panel"><h1>Orte</h1><div class="table-wrap"><table><thead><tr><th>Name</th><th>Land</th><th>Status</th><th></th></tr></thead><tbody id="places"></tbody></table></div></section><section class="panel"><h2>Ort hinzufügen</h2><form id="new-place"><input name="name" required placeholder="Name"><input name="country" required maxlength="2" placeholder="Land, z. B. DE"><div class="two"><input name="lat" required type="number" step="any" placeholder="Breitengrad"><input name="lon" required type="number" step="any" placeholder="Längengrad"></div><label><input name="active" type="checkbox" checked> Aktiv</label><button>Speichern</button></form></section></section></main><script src="/static/app.js"></script></body></html>
